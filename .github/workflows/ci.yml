name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

# Opt the JS-based actions into Node 24 ahead of the Node 20 removal (GitHub
# Actions deprecation, 2025). Avoids the deprecation warnings on checkout/
# setup-java/import-gpg without pinning specific action major versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Check, test, integration-test
        # One sbt invocation for the whole build: separate `sbt ...` steps each spawn/attach a server, and a second
        # invocation attaching to the first step's lingering server can die instantly (0-output exit 1). A single
        # server lifecycle avoids that. `check` = scalafix+scalafmt; sbt 2.x `test` is incremental, so `testFull`
        # forces a full run; It/testFull runs the integration suites.
        run: sbt "; check ; testFull ; llm4zioFlow/It/testFull ; llm4zioRunner/It/testFull"

  publish:
    name: Publish to Maven Central
    needs: [ test ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.PGP_SECRET }}
          passphrase: ${{ secrets.PGP_PASSPHRASE }}

      - name: Publish to Maven Central
        run: sbt --batch --no-colors ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

      - name: Create GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "See CHANGELOG.md for detailed release notes."
          token: ${{ secrets.GITHUB_TOKEN }}
